      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');

      .wrap {
        --pitch-dark: #0F241C;
        --pitch-mid: #1B3A2C;
        --paper: #EFE8D6;
        --chalk: #F5F1E4;
        --gold: #C9A227;
        --muted: #8FAE9B;
        --red: #A6352C;
        font-family: 'Inter', sans-serif;
        background: var(--pitch-dark);
        color: var(--chalk);
        min-height: 100%;
        padding-bottom: 24px;
      }
      .loadingScreen { padding: 40px 16px; text-align: center; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 20px; letter-spacing: 0.05em; }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 16px 14px;
        border-bottom: 2px solid var(--gold);
        background: linear-gradient(180deg, var(--pitch-mid), var(--pitch-dark));
      }
      .crestWrap { position: relative; flex-shrink: 0; }
      .crestUpload {
        width: 42px;
        height: 42px;
        border-radius: 6px;
        overflow: hidden;
        background: rgba(245,241,228,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(201,162,39,0.4);
        cursor: pointer;
        position: relative;
      }
      .crestImg { width: 100%; height: 100%; object-fit: cover; }
      .crest { font-size: 22px; line-height: 1; }
      .clubinfo { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
      .clubname {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.02em;
        background: transparent;
        border: none;
        color: var(--chalk);
        padding: 0;
        outline: none;
        width: 100%;
      }
      .clubname::placeholder { color: var(--muted); }
      .season {
        background: transparent;
        border: none;
        color: var(--gold);
        font-size: 13px;
        padding: 0;
        outline: none;
        width: 100%;
      }

      .tabs {
        display: flex;
        border-bottom: 1px solid rgba(245,241,228,0.15);
        overflow-x: auto;
      }
      .tabbtn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 6px;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 11px;
        font-family: 'Inter', sans-serif;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        white-space: nowrap;
      }
      .tabbtn-active { color: var(--gold); border-bottom-color: var(--gold); }

      .content { padding: 16px; }

      .sectionTitle {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: var(--gold);
        margin: 22px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(201,162,39,0.35);
      }
      .sectionTitle:first-child { margin-top: 0; }

      .empty { padding: 40px 8px; text-align: center; color: var(--muted); }
      .emptySub { color: var(--muted); font-size: 12px; }

      .filterBar { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
      .filterBar .field { flex: 1; min-width: 140px; }

      .scoreboard {
        display: flex;
        gap: 1px;
        background: rgba(245,241,228,0.15);
        border: 1px solid rgba(245,241,228,0.15);
        margin-bottom: 18px;
      }
      .scoreblock {
        flex: 1;
        background: var(--pitch-mid);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 4px;
      }
      .scorenum { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; color: var(--gold); line-height: 1; }
      .scoreblock-loss .scorenum { color: var(--red); }
      .scorelabel { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: lowercase; }

      .statrow {
        display: flex;
        justify-content: space-between;
        padding: 9px 0;
        border-bottom: 1px solid rgba(245,241,228,0.1);
        font-size: 14px;
        gap: 12px;
      }
      .statrow span:first-child { color: var(--muted); }
      .statrow strong { color: var(--paper); text-align: right; }

      .statTable { display: flex; flex-direction: column; font-size: 12px; overflow-x: auto; }
      .statTableTitleRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
      .statTableTitleRow .field { width: auto; max-width: 180px; }
      .statTableHead, .statTableRow {
        display: grid;
        grid-template-columns: 1fr 16px 22px 16px 16px 22px 24px 30px 34px;
        gap: 3px;
        padding: 7px 0;
        align-items: center;
        text-align: right;
        min-width: 340px;
      }
