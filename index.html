      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap');

      .loadingScreen { padding: 40px 16px; text-align: center; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 20px; letter-spacing: 0.05em; }

        border: 1px solid rgba(201,162,39,0.4);
        cursor: pointer;
        position: relative;
      }
      .crestImg { width: 100%; height: 100%; object-fit: cover; }
      .crest { font-size: 22px; line-height: 1; }
      .clubinfo { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
      .clubname {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.02em;
        background: transparent;
        border: none;
        color: var(--chalk);
        padding: 0;
        outline: none;
        width: 100%;
      }
      .clubname::placeholder { color: var(--muted); }
      .season {
        background: transparent;
        border: none;
        color: var(--gold);
        font-size: 13px;
        padding: 0;
        outline: none;
        width: 100%;
      }

      .tabs {
        display: flex;
        border-bottom: 1px solid rgba(245,241,228,0.15);
        overflow-x: auto;
      }
      .tabbtn {

        border: none;
        color: var(--muted);
        font-size: 11px;
        font-family: 'Inter', sans-serif;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        white-space: nowrap;
      }
      .tabbtn-active { color: var(--gold); border-bottom-color: var(--gold); }

      .content { padding: 16px; }

      .sectionTitle {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.04em;
        color: var(--gold);
        margin: 22px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(201,162,39,0.35);
      }
      .sectionTitle:first-child { margin-top: 0; }

      .empty { padding: 40px 8px; text-align: center; color: var(--muted); }
      .emptySub { color: var(--muted); font-size: 12px; }

      .filterBar { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
      .filterBar .field { flex: 1; min-width: 140px; }

      .scoreboard {
        display: flex;
        gap: 1px;
        background: rgba(245,241,228,0.15);
        border: 1px solid rgba(245,241,228,0.15);
        margin-bottom: 18px;
      }
      .scoreblock {
        flex: 1;
        background: var(--pitch-mid);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 4px;
      }
      .scorenum { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; color: var(--gold); line-height: 1; }
      .scoreblock-loss .scorenum { color: var(--red); }
      .scorelabel { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: lowercase; }

      .statrow {
        display: flex;
        justify-content: space-between;
        padding: 9px 0;
        border-bottom: 1px solid rgba(245,241,228,0.1);

        gap: 12px;
      }
      .statrow span:first-child { color: var(--muted); }
      .statrow strong { color: var(--paper); text-align: right; }

      .statTable { display: flex; flex-direction: column; font-size: 12px; overflow-x: auto; }
      .statTableTitleRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
      .statTableTitleRow .field { width: auto; max-width: 180px; }
      .statTableHead, .statTableRow {
        display: grid;

        text-align: right;

      .statTableRow { border-bottom: 1px solid rgba(245,241,228,0.08); }

      .statTableHead span:first-child { text-align: left; }

      .rankTable { display: flex; flex-direction: column; font-size: 12px; margin-top: 4px; }
      .rankTableHead, .rankTableRow {
        display: grid;

        gap: 6px;
        padding: 8px 0;
        align-items: center;
        text-align: right;
      }
      .rankTableHead { color: var(--gold); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid rgba(201,162,39,0.35); }
      .rankTableRow { border-bottom: 1px solid rgba(245,241,228,0.08); }

      .rankTableRow-2col .rankTableName,
      .rankTableHead.rankTableRow-2col span:first-child { text-align: left; }
      .rankTableRow-extra { grid-template-columns: 22px 1fr 22px 22px 22px 34px; }

      .titleIcon { color: var(--gold); flex-shrink: 0; }

      .formCard {

        gap: 8px;
        margin-bottom: 14px;
      }
      .fieldRow { display: flex; gap: 8px; }
      .avatarFieldRow { align-items: center; }

        font-size: 14px;

        outline: none;
        font-family: 'Inter', sans-serif;
      }
      .field::placeholder { color: var(--muted); }
      .fieldSmall { max-width: 96px; flex-shrink: 0; }

      .statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }

      .statLabel { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
      .statInput {
        background: var(--pitch-dark);
        border: 1px solid rgba(245,241,228,0.2);
        color: var(--chalk);

        font-size: 13px;
        outline: none;
        width: 100%;
        font-family: 'Inter', sans-serif;
      }

      .btnPrimary {
        display: flex;

        font-size: 14px;
        cursor: pointer;
        width: 100%;

      }
      .btnGhost {
        display: flex;
        align-items: center;
        gap: 6px;
        background: none;

        font-size: 13px;
        cursor: pointer;

      .formActions { display: flex; gap: 8px; margin-top: 10px; }

      }
